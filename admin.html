<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard Penulis — Aksara Bumi</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
      background: #fafafa;
    }

    h1 {
      margin-bottom: 5px;
    }

    .welcome {
      margin-bottom: 20px;
      color: #555;
    }

    .card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 25px;
      margin-top: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: inherit;
      font-size: 15px;
    }

    textarea {
      min-height: 300px;
      resize: vertical;
    }

    button {
      padding: 11px 18px;
      margin-top: 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }

    .save-button {
      background: #222;
      color: white;
    }

    .logout-button {
      background: #eee;
      color: #222;
      margin-left: 8px;
    }

    #status {
      padding: 14px;
      background: #f0f0f0;
      border-radius: 6px;
      margin-top: 20px;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Dashboard Penulis</h1>

  <div id="status">
    Memeriksa akun...
  </div>

  <div class="card" id="editor" style="display: none;">

    <h2>Tulis Artikel</h2>

    <label for="judul">Judul Artikel</label>
    <input
      type="text"
      id="judul"
      placeholder="Masukkan judul artikel"
    >

    <label for="kategori">Kategori</label>
    <select id="kategori">
      <option value="catatan-bacaan">Catatan Bacaan</option>
      <option value="arkeologi">Arkeologi</option>
      <option value="sejarah">Sejarah</option>
      <option value="budaya">Budaya</option>
      <option value="lainnya">Lainnya</option>
    </select>

    <label for="isi">Isi Artikel</label>
    <textarea
      id="isi"
      placeholder="Tulis artikelmu di sini..."
    ></textarea>

    <button
      class="save-button"
      onclick="simpanDraft()"
    >
      Simpan sebagai Draft
    </button>

    <button
      class="logout-button"
      onclick="logout()"
    >
      Keluar
    </button>

    <div id="message"></div>

  </div>

  <script>
    const SUPABASE_URL =
      "https://dzmmjilhqqqghbikxbpi.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_Sh5FUzXDqdpB9HjMmp_Shw_4FQXzl8J";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    async function cekAuthor() {
      const status =
        document.getElementById("status");

      const editor =
        document.getElementById("editor");

      const {
        data: { session },
        error: sessionError
      } = await supabaseClient.auth.getSession();

      if (sessionError) {
        status.textContent =
          "Gagal membaca sesi login.";

        console.error(sessionError);
        return;
      }

      if (!session) {
        status.textContent =
          "Kamu belum login. Silakan masuk terlebih dahulu.";

        return;
      }

      const user = session.user;

      const {
        data: profile,
        error: profileError
      } = await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .single();

      if (profileError || !profile) {
        status.textContent =
          "Profil akun tidak ditemukan.";

        console.error(profileError);
        return;
      }

      if (profile.role !== "author") {
        status.textContent =
          "Akses ditolak. Halaman ini khusus penulis.";

        return;
      }

      status.innerHTML =
        "<strong>Selamat datang, Penulis Aksara Bumi.</strong><br>" +
        "Email: " + user.email + "<br>" +
        "Role: " + profile.role;

      editor.style.display = "block";
    }

    async function simpanDraft() {
      const message =
        document.getElementById("message");

      const judul =
        document.getElementById("judul").value.trim();

      const kategori =
        document.getElementById("kategori").value;

      const isi =
        document.getElementById("isi").value.trim();

      message.textContent = "";

      if (!judul) {
        message.textContent =
          "Judul artikel belum diisi.";

        return;
      }

      if (!isi) {
        message.textContent =
          "Isi artikel belum diisi.";

        return;
      }

      const slug = judul
        .toLowerCase()
        .replace(/[^a-z0-9\s-]/g, "")
        .trim()
        .replace(/\s+/g, "-");

      const {
        data: { session },
        error: sessionError
      } = await supabaseClient.auth.getSession();

      if (sessionError || !session) {
        message.textContent =
          "Sesi login sudah berakhir. Silakan login kembali.";

        return;
      }

      const { error } =
        await supabaseClient
          .from("articles")
          .insert({
            title: judul,
            slug: slug,
            category: kategori,
            content: isi,
            status: "draft",
            author_id: session.user.id
          });

      if (error) {
        console.error(error);

        message.textContent =
          "Gagal menyimpan draft: " +
          error.message;

        return;
      }

      message.textContent =
        "Draft artikel berhasil disimpan.";

      document.getElementById("judul").value = "";
      document.getElementById("isi").value = "";
    }

    async function logout() {
      await supabaseClient.auth.signOut();

      window.location.href =
        "login.html";
    }

    cekAuthor();
  </script>

</body>
</html>
