<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Penulis — Aksara Bumi</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 60px auto;
      padding: 20px;
      line-height: 1.6;
    }

    #status {
      padding: 15px;
      border: 1px solid #ddd;
      margin-top: 20px;
    }

    button {
      padding: 10px 16px;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <h1>Dashboard Penulis</h1>

  <div id="status">Memeriksa akun...</div>

  <button onclick="logout()">Keluar</button>

  <script>
    const SUPABASE_URL = "https://dzmmjilhqqgqhbikxbpi.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_Sh5FUzXDqdpB9HjMmp_Shw_4FQXzl8J";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    async function cekAuthor() {
      const status = document.getElementById("status");

      // Cek sesi login yang tersimpan di browser
      const {
        data: { session },
        error: sessionError
      } = await supabaseClient.auth.getSession();

      if (sessionError) {
        status.textContent =
          "Terjadi masalah saat memeriksa sesi login.";
        console.error(sessionError);
        return;
      }

      if (!session) {
        status.textContent =
          "Kamu belum login. Silakan masuk terlebih dahulu.";
        return;
      }

      // Ambil data pengguna yang sedang login
      const {
        data: { user },
        error: userError
      } = await supabaseClient.auth.getUser();

      if (userError || !user) {
        status.textContent =
          "Akun tidak ditemukan. Silakan login kembali.";
        return;
      }

      // Cek role pengguna
      const { data: profile, error: profileError } =
        await supabaseClient
          .from("profiles")
          .select("role")
          .eq("id", user.id)
          .single();

      if (profileError || !profile) {
        status.textContent =
          "Profil akun tidak ditemukan.";
        console.error(profileError);
        return;
      }

      // Pastikan hanya author yang boleh masuk
      if (profile.role !== "author") {
        status.textContent =
          "Akses ditolak. Halaman ini khusus penulis.";
        return;
      }

      status.innerHTML =
        "<strong>Selamat datang, Penulis Aksara Bumi.</strong><br><br>" +
        "Email: " + user.email + "<br>" +
        "Role: " + profile.role;
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = "login.html";
    }

    cekAuthor();
  </script>

</body>
</html>
